name: ios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-capture:
    strategy:
      fail-fast: false
      matrix:
        screen: [reader]
    runs-on: macos-26
    timeout-minutes: 80
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_QINGMU_FIXTURE: 'true'
      EXPO_PUBLIC_QINGMU_DEV_TOKEN: mock-fixture-only
      EXPO_PUBLIC_QINGMU_API_BASE_URL: https://127.0.0.1:18788
      EXPO_PUBLIC_QINGMU_TEST_DATE: '2026-09-02'
      EXPO_PUBLIC_YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
      EXPO_PUBLIC_QINGMU_YV_TEXT_PROBE: 'true'
      EXPO_PUBLIC_QINGMU_AUDIO_AUTHORIZED: 'true'
      OUT: capture-out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4eceb24b70f9970a53543d289399ac5d99f41133
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - name: bind unmodified source and build environment
        run: |
          mkdir -p capture-out
          test "$(git rev-parse HEAD)" = 4eceb24b70f9970a53543d289399ac5d99f41133
          test -z "$(git status --porcelain --untracked-files=no)"
          node <<'JS'
          const fs=require('fs'),cp=require('child_process'),c=require('crypto');
          const env=Object.fromEntries(Object.entries(process.env).filter(([k])=>k.startsWith('EXPO_PUBLIC_')).sort());
          fs.writeFileSync('capture-out/source.json',JSON.stringify({sourceCommit:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sourceTree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),sourceDirty:cp.execFileSync('git',['status','--porcelain','--untracked-files=no'],{encoding:'utf8'}),environmentNames:Object.keys(env),environmentDigest:c.createHash('sha256').update(JSON.stringify(env)).digest('hex'),node:process.version,workflowCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,observedAt:new Date().toISOString()},null,2));
          JS
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install --clean
      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('package-lock.json', 'patches/**', 'app.json', 'app.config.js') }}
      - run: cd ios && pod install
      - run: bash scripts/ios/build-simulator.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: install pinned Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | MAESTRO_VERSION=2.10.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: capture local welcome or fixture account without identity interaction
        env:
          CAPTURE_SCREEN: ${{ matrix.screen }}
        run: |
          set -euo pipefail
          PIDS=''
          UDID=''
          cleanup() {
            for pid in $PIDS; do kill "$pid" 2>/dev/null || true; done
            if [ -n "$UDID" ]; then xcrun simctl shutdown "$UDID" || true; fi
          }
          trap cleanup EXIT
          bash scripts/ios/make-ci-tls.sh capture-out/tls
          QINGMU_DEV_TOKEN=mock-fixture-only QINGMU_FIXTURE_ROSTER=two-member-week QINGMU_FIXTURE_DEFAULT_MEMBER=fixture:self QINGMU_DB_PATH=:memory: QINGMU_SERVER_PORT=18787 npx tsx server/http.ts > capture-out/server.txt 2>&1 &
          PIDS="$PIDS $!"
          npx tsx scripts/ios/count-proxy.ts 18788 18787 capture-out/requests.log capture-out/tls/leaf.pem capture-out/tls/leaf.key > capture-out/proxy.txt 2>&1 &
          PIDS="$PIDS $!"
          for i in $(seq 1 30); do curl -fsS --cacert capture-out/tls/ca.pem https://127.0.0.1:18788/api/health > capture-out/health.json && break; sleep 1; done
          test -s capture-out/health.json
          UDID=$(xcrun simctl create qm-mock-capture 'iPhone 17' com.apple.CoreSimulator.SimRuntime.iOS-26-4)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl keychain "$UDID" add-root-cert capture-out/tls/ca.pem
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" "$(cat capture-out/app-path.txt)"
          maestro --version > /dev/null 2>&1
          "$HOME/.maestro/deps/applesimutils" --byId "$UDID" --bundle org.qingmu.youth --setPermissions notifications=YES
          MAESTRO_DRIVER_STARTUP_TIMEOUT=600000 maestro --device "$UDID" hierarchy --no-reinstall-driver > capture-out/warmup.txt 2>&1
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          touch capture-out/.flows-start
          for flow in .maestro/ios/10-reader-open.yaml .maestro/ios/11-reader-sheets.yaml .maestro/ios/12-reader-verse.yaml; do
            name=$(basename "$flow" .yaml)
            maestro --device "$UDID" test --no-reinstall-driver "$flow" --format junit --output "capture-out/$name.xml" > "capture-out/$name.txt" 2>&1
            maestro --device "$UDID" hierarchy --no-reinstall-driver > "capture-out/$name-hierarchy.txt"
            if grep -Eqi '[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}' "capture-out/$name-hierarchy.txt"; then echo 'Privacy check failed'; exit 1; fi
          done
          for name in 10-reader-open 11-plan-scrolled 12-reader-verse; do
            file=$(find . "$HOME/.maestro" -name "$name.png" -newer capture-out/.flows-start -not -path './node_modules/*' -not -path './capture-out/*' -print -quit)
            test -n "$file"
            cp "$file" "capture-out/$name.png"
          done
          xcrun simctl list devices available -j > capture-out/devices.json
          node <<'JS'
          const fs=require('fs'),c=require('crypto'),cp=require('child_process');
          const files=['10-reader-open','11-plan-scrolled','12-reader-verse'].map(name=>{const b=fs.readFileSync(`capture-out/${name}.png`);return {name:name+'.png',sha256:c.createHash('sha256').update(b).digest('hex'),bytes:b.length,width:b.readUInt32BE(16),height:b.readUInt32BE(20),colorType:b[25]};});
          const app=fs.readFileSync('capture-out/app-path.txt','utf8').trim();
          const version=cp.execFileSync('/usr/libexec/PlistBuddy',['-c','Print CFBundleShortVersionString',app+'/Info.plist'],{encoding:'utf8'}).trim();
          const build=cp.execFileSync('/usr/libexec/PlistBuddy',['-c','Print CFBundleVersion',app+'/Info.plist'],{encoding:'utf8'}).trim();
          fs.writeFileSync('capture-out/receipt.json',JSON.stringify({files,actualVersion:version,actualBuild:build,observedAt:new Date().toISOString(),identityInput:false,thirdPartyLoginOpened:false,accountData:'two-member-week fixture only',flows:['10-reader-open','11-reader-sheets','12-reader-verse'],scope:'screenshot capture only; not CI acceptance or final common release'},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots-main
          path: |
            capture-out/source.json
            capture-out/receipt.json
            capture-out/*.png
            capture-out/*-hierarchy.txt
            capture-out/10-reader-open.txt
            capture-out/11-reader-sheets.txt
            capture-out/12-reader-verse.txt
            capture-out/*.xml
            capture-out/warmup.txt
            capture-out/xcodebuild-errors.txt
          retention-days: 14
