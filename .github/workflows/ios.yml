name: ios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-baseline:
    strategy:
      fail-fast: false
      matrix:
        screen: [account]
    runs-on: macos-26
    timeout-minutes: 80
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_QINGMU_FIXTURE: ${{ matrix.screen == 'account' && 'true' || 'false' }}
      EXPO_PUBLIC_QINGMU_DEV_TOKEN: mock-fixture-only
      EXPO_PUBLIC_QINGMU_API_BASE_URL: https://127.0.0.1:18788
      EXPO_PUBLIC_QINGMU_TEST_DATE: '2026-09-02'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 123456789012-obviously-fake-web-client.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.123456789012-obviously-fake-ios-client
      OUT: capture-out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c173df2ef989b02ef165c3dbe341973dca648f9f
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - name: bind unmodified source and build environment
        run: |
          mkdir -p capture-out
          test "$(git rev-parse HEAD)" = c173df2ef989b02ef165c3dbe341973dca648f9f
          test -z "$(git status --porcelain --untracked-files=no)"
          node <<'JS'
          const fs=require('fs'),cp=require('child_process'),c=require('crypto');
          const env=Object.fromEntries(Object.entries(process.env).filter(([k])=>k.startsWith('EXPO_PUBLIC_')).sort());
          fs.writeFileSync('capture-out/source.json',JSON.stringify({sourceCommit:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sourceTree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),sourceDirty:cp.execFileSync('git',['status','--porcelain','--untracked-files=no'],{encoding:'utf8'}),environment:env,environmentDigest:c.createHash('sha256').update(JSON.stringify(env)).digest('hex'),node:process.version,workflowCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,observedAt:new Date().toISOString()},null,2));
          JS
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install --clean
      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('package-lock.json', 'patches/**', 'app.json', 'app.config.js') }}
      - run: cd ios && pod install
      - run: bash scripts/ios/build-simulator.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: install pinned Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | MAESTRO_VERSION=2.10.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: capture local welcome or fixture account without identity interaction
        env:
          CAPTURE_SCREEN: ${{ matrix.screen }}
        run: |
          set -euo pipefail
          PIDS=''
          UDID=''
          cleanup() {
            for pid in $PIDS; do kill "$pid" 2>/dev/null || true; done
            if [ -n "$UDID" ]; then xcrun simctl shutdown "$UDID" || true; fi
          }
          trap cleanup EXIT
          bash scripts/ios/make-ci-tls.sh capture-out/tls
          QINGMU_DEV_TOKEN=mock-fixture-only QINGMU_FIXTURE_ROSTER=two-member-week QINGMU_FIXTURE_DEFAULT_MEMBER=fixture:self QINGMU_DB_PATH=:memory: QINGMU_SERVER_PORT=18787 npx tsx server/http.ts > capture-out/server.txt 2>&1 &
          PIDS="$PIDS $!"
          npx tsx scripts/ios/count-proxy.ts 18788 18787 capture-out/requests.log capture-out/tls/leaf.pem capture-out/tls/leaf.key > capture-out/proxy.txt 2>&1 &
          PIDS="$PIDS $!"
          for i in $(seq 1 30); do curl -fsS --cacert capture-out/tls/ca.pem https://127.0.0.1:18788/api/health > capture-out/health.json && break; sleep 1; done
          test -s capture-out/health.json
          UDID=$(xcrun simctl create qm-mock-capture 'iPhone 17' com.apple.CoreSimulator.SimRuntime.iOS-26-4)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl keychain "$UDID" add-root-cert capture-out/tls/ca.pem
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" "$(cat capture-out/app-path.txt)"
          maestro --version > /dev/null 2>&1
          "$HOME/.maestro/deps/applesimutils" --byId "$UDID" --bundle org.qingmu.youth --setPermissions notifications=YES
          MAESTRO_DRIVER_STARTUP_TIMEOUT=600000 maestro --device "$UDID" hierarchy --no-reinstall-driver > capture-out/warmup.txt 2>&1
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          if [ "$CAPTURE_SCREEN" = login ]; then
            cat > capture-flow.yaml <<'YAML'
          appId: org.qingmu.youth
          ---
          - launchApp
          - extendedWaitUntil:
              visible: '使用Google登入'
              timeout: 90000
          - assertVisible: '竹科靈糧堂的每日讀經'
          YAML
          else
            cat > capture-flow.yaml <<'YAML'
          appId: org.qingmu.youth
          ---
          - launchApp
          - extendedWaitUntil:
              visible: '積分'
              timeout: 90000
          - repeat:
              times: 3
              while:
                notVisible: '開啟積分操作'
              commands:
                - tapOn:
                    text: '積分'
                    retryTapIfNoChange: false
          - extendedWaitUntil:
              visible: '開啟積分操作'
              timeout: 30000
          - tapOn: '開啟帳戶'
          - extendedWaitUntil:
              visible: '申請刪除帳號與資料'
              timeout: 30000
          - assertVisible: '測試成員甲'
          YAML
          fi
          if ! maestro --device "$UDID" test --no-reinstall-driver capture-flow.yaml --format junit --output capture-out/flow.xml > capture-out/flow.txt 2>&1; then
            maestro --device "$UDID" hierarchy --no-reinstall-driver > capture-out/hierarchy.txt 2>&1 || true
            if ! grep -Eqi '[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}' capture-out/hierarchy.txt; then xcrun simctl io "$UDID" screenshot capture-out/failure-screen.png || true; fi
            exit 1
          fi
          maestro --device "$UDID" hierarchy --no-reinstall-driver > capture-out/hierarchy.txt
          if grep -Eqi '[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}' capture-out/hierarchy.txt; then echo 'Privacy check failed'; exit 1; fi
          xcrun simctl io "$UDID" screenshot "capture-out/$CAPTURE_SCREEN.png"
          xcrun simctl list devices available -j > capture-out/devices.json
          node <<'JS'
          const fs=require('fs'),c=require('crypto'); const file=`capture-out/${process.env.CAPTURE_SCREEN}.png`;
          const b=fs.readFileSync(file);fs.writeFileSync('capture-out/receipt.json',JSON.stringify({screen:process.env.CAPTURE_SCREEN,sha256:c.createHash('sha256').update(b).digest('hex'),width:b.readUInt32BE(16),height:b.readUInt32BE(20),observedAt:new Date().toISOString(),identityInput:false,thirdPartyLoginOpened:false,accountData:'two-member-week fixture only'},null,2));
          JS
      - name: preserve failed simulator candidate for bounded diagnostics
        if: failure()
        run: |
          if [ -s capture-out/app-path.txt ]; then ditto -c -k --sequesterRsrc --keepParent "$(cat capture-out/app-path.txt)" capture-out/baseline-app.zip; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-baseline-${{ matrix.screen }}
          path: |
            capture-out/source.json
            capture-out/receipt.json
            capture-out/*.png
            capture-out/hierarchy.txt
            capture-out/flow.txt
            capture-out/flow.xml
            capture-out/warmup.txt
            capture-out/baseline-app.zip
            capture-out/xcodebuild-errors.txt
          retention-days: 14
