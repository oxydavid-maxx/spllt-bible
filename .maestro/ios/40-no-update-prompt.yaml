# An iPhone that is not a TestFlight install never gets an update dialog (src/services/appUpdate.ts), even though
# the fixture backend publishes a newer version (server/fixtureVersionNotice.ts): wait past its 20 s retry.
# The TestFlight case is 42-testflight-update.
appId: org.qingmu.youth
---
- launchApp
- extendedWaitUntil:
    visible: "積分"
    timeout: 90000
- extendedWaitUntil:
    visible: "有新版本.*"
    timeout: 25000
    optional: true
- assertNotVisible: "有新版本.*"
