# .maestro/ios/00-smoke.yaml
# Tab buttons are matched by their accessibility labels (app/(tabs)/_layout.tsx): 公告, 讀經入口, 積分.
# 日記 left the tab bar in 0.5.27 (href: null), so no flow looks for its 靈修日記 button.
appId: org.qingmu.youth
---
# The app was just installed and granted notifications by run-flows.sh; no clearState, which would reinstall it.
- launchApp
- extendedWaitUntil:
    visible: "積分"
    timeout: 90000
- assertVisible: "公告"
# Tabs are already exposed while Today is replacing itself with Reader. Wait for the
# destination; the tab hierarchy alone is not readiness.
- extendedWaitUntil:
    visible: "更多閱讀工具"
    timeout: 30000
# A changing reader (network/voice state) is not proof of a successful tab change.
# Use the destination hierarchy for bounded navigation, not screenshot animation
# polling: that lost the cold-start XCUITest connection in run 36748404417.
- repeat:
    times: 3
    while:
      notVisible: "開啟積分操作"
    commands:
      - tapOn:
          text: "積分"
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "開啟積分操作"
    timeout: 15000
# 0.5.27: the member's own name sits in the goal card under the calendar, below an iPhone's fold.
- scrollUntilVisible:
    element: "測試成員甲"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 00-smoke
- tapOn: "讀經入口"
