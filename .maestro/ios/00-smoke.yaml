# .maestro/ios/00-smoke.yaml
# Tab buttons are matched by their accessibility labels (app/(tabs)/_layout.tsx): 公告, 讀經入口, 積分, 靈修日記.
appId: org.qingmu.youth
---
# The app was just installed and granted notifications by run-flows.sh; no clearState, which would reinstall it.
- launchApp
- extendedWaitUntil:
    visible: "積分"
    timeout: 90000
- assertVisible: "公告"
- assertVisible: "靈修日記"
# Tabs are already exposed while Today is replacing itself with Reader. Wait for the
# destination, then settle before tapping; the startup hierarchy alone is not readiness.
- extendedWaitUntil:
    visible: "更多閱讀工具"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "積分"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "開啟積分操作"
    timeout: 15000
- extendedWaitUntil:
    visible: "測試成員甲"
    timeout: 30000
- takeScreenshot: 00-smoke
- tapOn: "讀經入口"
