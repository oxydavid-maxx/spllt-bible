# 光佑 20261021: 全體 (管理) shows which version each person's phone runs and the day it was opened. This app
# reported itself to the fixture backend on its own requests; the second fixture member has no phone, so that
# row says 沒有版本紀錄. The simulator cannot unlock with Face ID, so this fixture build is told to unlock by a
# launch argument (src/services/adminUnlockGuard.ts fixtureUnlockRequested).
appId: org.qingmu.youth
---
- launchApp:
    arguments:
      qingmuFixtureUnlock: "yes"
# The tab bar can appear while Today is still replacing itself with Reader (00-smoke).
- extendedWaitUntil:
    visible: "更多閱讀工具"
    timeout: 90000
- repeat:
    times: 3
    while:
      notVisible: "開啟積分操作"
    commands:
      - tapOn:
          text: "積分"
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "開啟積分操作"
    timeout: 30000
- tapOn: "開啟帳戶"
- extendedWaitUntil:
    visible: "登出"
    timeout: 15000
# 2026-10-31 (A): the entry is the 全體 row of the 管理者 card, no longer 全體 (管理) at the foot of the page.
- scrollUntilVisible:
    element: "全體"
    direction: DOWN
    timeout: 15000
- tapOn: "全體"
- extendedWaitUntil:
    visible: '查看測試成員甲的積分.*iOS 0\.5\.\d+.*\d+/\d+ 打開'
    timeout: 30000
- assertVisible: '查看測試成員乙的積分.*沒有版本紀錄'
- takeScreenshot: 42-version-log
