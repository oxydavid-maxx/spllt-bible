# 11-reader-sheets — each reader sheet opens from 更多閱讀工具 and closes again: font settings (SDK overlay),
# the version page (app page) and the chapter picker (SDK overlay; the overlay's close is 完成設定，返回閱讀).
appId: org.qingmu.youth
---
- launchApp
- extendedWaitUntil:
    visible: "積分"
    timeout: 90000
- tapOn: "讀經入口"
- extendedWaitUntil:
    visible: "更多閱讀工具"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "官方閱讀器還在準備中.*"
    timeout: 60000
- tapOn: "整份讀經計畫"
- extendedWaitUntil:
    visible: "關閉計畫"
    timeout: 15000
# A content swipe must scroll the list; the separate header drag dismisses it.
- swipe:
    direction: UP
    duration: 500
- assertVisible: "關閉計畫"
- takeScreenshot: 11-plan-scrolled
- swipe:
    from:
      text: "整份讀經計畫"
    direction: DOWN
    duration: 600
- extendedWaitUntil:
    notVisible: "關閉計畫"
    timeout: 10000
- takeScreenshot: 11-plan-dismissed
- tapOn: "整份讀經計畫"
- extendedWaitUntil:
    visible: "關閉計畫"
    timeout: 15000
- tapOn: "關閉計畫"
- extendedWaitUntil:
    notVisible: "關閉計畫"
    timeout: 10000
- tapOn: "更多閱讀工具"
- tapOn: "調整字體"
- extendedWaitUntil:
    visible: "完成設定，返回閱讀"
    timeout: 15000
- tapOn: "完成設定，返回閱讀"
- extendedWaitUntil:
    notVisible: "完成設定，返回閱讀"
    timeout: 10000
- tapOn: "更多閱讀工具"
- tapOn: "選擇譯本"
- extendedWaitUntil:
    visible: "關閉譯本選擇"
    timeout: 15000
- tapOn: "關閉譯本選擇"
- extendedWaitUntil:
    notVisible: "關閉譯本選擇"
    timeout: 10000
- tapOn: "更多閱讀工具"
- tapOn: "選擇其他章節"
- extendedWaitUntil:
    visible: "書卷"
    timeout: 15000
- tapOn: "完成設定，返回閱讀"
- extendedWaitUntil:
    notVisible: "書卷"
    timeout: 10000
