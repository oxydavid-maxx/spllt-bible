# 41-journal — the journal tab on iOS. Captures the page for the M5 mock (the folder-sync button is Android-only:
# iOS has no persistent folder permission), and checks export stays reachable. The export footer appears once
# the member has at least one saved entry, so the flow writes one first (ASCII: simulator typing of CJK is not
# reliable).
appId: org.qingmu.youth
---
- launchApp
- extendedWaitUntil:
    visible: "積分"
    timeout: 90000
- tapOn: "靈修日記"
# The editor is found by position: by label it collides with the 靈修日記 tab, and iOS exposes no placeholder.
# (If this misses, the failure leaves the screen's labels in 41-journal-screen.txt.)
- extendedWaitUntil:
    visible: "歷史記錄"
    timeout: 30000
- tapOn:
    point: "50%,22%"
- inputText: "Thanks for today"
# Maestro's hideKeyboard finds no dismiss action on a multiline input; a tap on the page (the ScrollView keeps
# only handled taps) closes the keyboard and saves the entry on blur, as a member would.
- tapOn: "歷史記錄"
- extendedWaitUntil:
    visible: "匯出靈修日記"
    timeout: 20000
- takeScreenshot: 41-journal
