# 41-journal — the journal tab on iOS. Captures the page for the M5 mock (the folder-sync button is Android-only:
# iOS has no persistent folder permission), and checks export stays reachable.
appId: org.qingmu.youth
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: "積分"
    timeout: 90000
- tapOn: "靈修日記"
- extendedWaitUntil:
    visible: "匯出靈修日記"
    timeout: 30000
- takeScreenshot: 41-journal-top
- scrollUntilVisible:
    element: "匯出靈修日記"
    direction: DOWN
- takeScreenshot: 41-journal-export
