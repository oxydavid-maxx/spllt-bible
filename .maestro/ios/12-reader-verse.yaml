# 12-reader-verse — tapping a verse selects it (the verse bar with Copy and Share appears), and tapping the same
# verse again lets it go (iPhone has no back key). Use the observed verse-one accessibility
# label: daily chapters wrap differently, so a fixed screen point can land between lines.
appId: org.qingmu.youth
---
- launchApp
- extendedWaitUntil:
    visible: "積分"
    timeout: 90000
- tapOn: "讀經入口"
- extendedWaitUntil:
    visible: "更多閱讀工具"
    timeout: 30000
- extendedWaitUntil:
    visible: '^1[\s\u00a0]*$'
    timeout: 60000
- tapOn:
    text: '^1[\s\u00a0]*$'
- extendedWaitUntil:
    visible: "Copy"
    timeout: 15000
- takeScreenshot: 12-reader-verse
- tapOn:
    text: '^1[\s\u00a0]*$'
- extendedWaitUntil:
    notVisible: "Copy"
    timeout: 10000
