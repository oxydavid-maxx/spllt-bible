# 21-audio-after-background — after 20 s in the background (run-flows.sh) narration is still playing, and it keeps
# playing across a tab switch. If iOS had paused it, the button would read 播放 again. No launchApp: this flow
# continues the app state that 20 left.
appId: org.qingmu.youth
---
- extendedWaitUntil:
    visible: "暫停.*語音"
    timeout: 15000
- runFlow:
    when:
      visible: "展開閱讀工具"
    commands:
      - tapOn: "展開閱讀工具"
- extendedWaitUntil:
    visible: "積分"
    timeout: 10000
- tapOn:
    text: "積分"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "開啟積分操作"
    timeout: 15000
- tapOn: "讀經入口"
- assertVisible: "暫停.*語音"
- tapOn: "暫停.*語音"
- extendedWaitUntil:
    visible: "播放.*語音"
    timeout: 10000
