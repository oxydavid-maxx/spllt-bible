# 20-audio-start — narration of the day's chapter starts in the reader (backend chapter audio, as in production).
# run-flows.sh then sends the app to the background for 20 s before 21.
appId: org.qingmu.youth
---
- launchApp
- extendedWaitUntil:
    visible: "積分"
    timeout: 90000
- tapOn: "讀經入口"
- extendedWaitUntil:
    visible: "(播放|重試).*語音"
    timeout: 60000
# The recorded initial state was 重試彼前4語音. narration.md defines one normal retry
# to reacquire/reprepare the source. Still require real playing state; never accept retry as PASS.
- runFlow:
    when:
      visible: "重試.*語音"
    commands:
      - tapOn: "重試.*語音"
      - extendedWaitUntil:
          visible: "暫停.*語音"
          timeout: 30000
- runFlow:
    when:
      visible: "播放.*語音"
    commands:
      - tapOn: "播放.*語音"
- extendedWaitUntil:
    visible: "暫停.*語音"
    timeout: 30000
